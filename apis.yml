name: One Five
description: >-
  One Five (styled one.five) is a sustainable packaging technology company based
  in Holm, Germany that pairs an AI-driven decision platform, Quartermaster, with
  ready-to-use recyclable and compostable packaging products. The Quartermaster
  platform embeds product-market-fit and material analysis into packaging
  development to accelerate material scouting and packing trials, helping consumer
  brands cut R&D spend, improve customer acquisition efficiency, and meet emerging
  packaging regulations while reducing environmental impact. One Five ships flexible
  sustainable packaging for categories such as dishwasher tablets and gummies through
  partners including Bluemorph and Glassleaf, and is backed by Speedinvest. The company
  offers no public developer API, SDKs, or developer portal at this time.
